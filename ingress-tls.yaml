apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-tls
  namespace: default

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - myapp.example.com
      secretName: tls-secret

  rules:
    - host: myapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app-service
                port:
                  number: 80
